
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcutta Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f14;
    --surface: #151921;
    --surface-hover: #1c2230;
    --border: #252d3a;
    --text: #e8ecf2;
    --muted: #7a839a;
    --dim: #555e74;
    --accent: #ff6b35;
    --win: #34d399;
    --win-bg: rgba(52,211,153,0.08);
    --loss: #f87171;
    --loss-bg: rgba(248,113,113,0.08);
    --live: #fbbf24;
    --live-bg: rgba(251,191,36,0.08);
    --sched: #60a5fa;
    --sched-bg: rgba(96,165,250,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; min-height:100vh; }

  header { padding:2.5rem 1rem 1.5rem; text-align:center; border-bottom:1px solid #1c2230; }
  .title { font-family:'Bebas Neue',sans-serif; font-size:3.2rem; letter-spacing:0.12em;
    background:linear-gradient(135deg,var(--accent),#ff9966); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
  .subtitle { color:var(--muted); font-size:0.78rem; letter-spacing:0.15em; text-transform:uppercase; margin-top:0.4rem; font-weight:500; }

  .stats { display:flex; justify-content:center; gap:1.5rem; margin-top:1.2rem; flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat-val { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; line-height:1; }
  .stat-lbl { font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; margin-top:0.1rem; }

  .container { max-width:720px; margin:0 auto; padding:0 1rem; }

  .day-hdr { display:flex; align-items:center; gap:0.8rem; margin:1.5rem 0 0.7rem; padding-left:0.2rem; }
  .day-lbl { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:0.1em; color:var(--muted); }
  .day-lbl.today { color:var(--accent); }
  .day-line { flex:1; height:1px; background:var(--border); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:0.9rem 1.1rem; margin-bottom:0.55rem; display:grid; grid-template-columns:1fr auto;
    align-items:center; gap:1rem; transition:background 0.2s; cursor:default; }
  .card:hover { background:var(--surface-hover); }
  .card-border-win { border-left:3px solid var(--win); }
  .card-border-loss { border-left:3px solid var(--loss); }
  .card-border-live { border-left:3px solid var(--live); }
  .card-border-scheduled { border-left:3px solid var(--sched); }

  .matchup { display:flex; align-items:baseline; gap:0.4rem; flex-wrap:wrap; }
  .seed { font-size:0.7rem; color:var(--muted); font-weight:600; }
  .my-team { font-weight:700; font-size:1.05rem; }
  .vs { font-size:0.72rem; color:var(--muted); font-weight:500; }
  .opp { font-weight:500; font-size:0.92rem; color:var(--muted); }
  .meta-row { font-size:0.7rem; color:var(--dim); margin-top:0.2rem; display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap; }
  .cost-tag { font-size:0.65rem; font-weight:600; padding:0.12rem 0.4rem; border-radius:3px; background:rgba(255,107,53,0.1); color:var(--accent); }
  .earnings-tag { font-size:0.65rem; font-weight:600; padding:0.12rem 0.4rem; border-radius:3px; }
  .earnings-pos { background:var(--win-bg); color:var(--win); }
  .earnings-neg { background:var(--loss-bg); color:var(--loss); }
  .earnings-zero { background:var(--sched-bg); color:var(--sched); }

  .status-col { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:0.2rem; }
  .score { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:0.04em; }
  .time-disp { font-size:0.85rem; font-weight:600; }

  .badge { font-size:0.6rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    padding:0.18rem 0.55rem; border-radius:4px; display:inline-block; }
  .badge-win { background:var(--win-bg); color:var(--win); }
  .badge-loss { background:var(--loss-bg); color:var(--loss); }
  .badge-live { background:var(--live-bg); color:var(--live); animation:pulse 1.5s ease infinite; }
  .badge-sched { background:var(--sched-bg); color:var(--sched); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .payout-section { max-width:720px; margin:2rem auto 0; padding:0 1rem; }
  .payout-title { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:0.1em; color:var(--muted); }
  .payout-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(90px,1fr)); gap:0.4rem; }
  .payout-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.6rem; text-align:center; }
  .payout-card .round-name { font-size:0.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .payout-card .round-pct { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; color:var(--accent); }
  .payout-card .round-amt { font-size:0.68rem; color:var(--dim); }
  .payout-card.active { border-color:var(--accent); background:rgba(255,107,53,0.05); }

  .summary-section { max-width:720px; margin:2rem auto 0; padding:0 1rem 2rem; }
  .summary-table { width:100%; border-collapse:collapse; }
  .summary-table th { font-size:0.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
    padding:0.5rem 0.6rem; text-align:left; border-bottom:1px solid var(--border); }
  .summary-table th.right { text-align:right; }
  .summary-table td { font-size:0.82rem; padding:0.55rem 0.6rem; border-bottom:1px solid rgba(37,45,58,0.5); }
  .summary-table td.right { text-align:right; font-variant-numeric:tabular-nums; }
  .summary-table tr:hover td { background:var(--surface-hover); }
  .summary-table .team-name { font-weight:600; }
  .summary-table .pos { color:var(--win); }
  .summary-table .neg { color:var(--loss); }
  .summary-table .neutral { color:var(--muted); }
  .summary-table tfoot td { border-top:2px solid var(--border); font-weight:700; font-size:0.85rem; }

  .footer { text-align:center; padding:2rem 1rem; color:var(--muted); font-size:0.7rem; letter-spacing:0.05em; }
  .footer .hl { color:var(--accent); }
  .footer .err { color:var(--loss); }

  @media(max-width:520px) { .title{font-size:2.4rem;} .stats{gap:1rem;} .payout-grid{grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>

<header>
  <div class="title">CALCUTTA TRACKER</div>
  <div class="subtitle">2026 NCAA Tournament</div>
  <div class="stats">
    <div class="stat"><div class="stat-val" style="color:var(--accent)" id="s-total">11</div><div class="stat-lbl">Teams</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--win)" id="s-alive">11</div><div class="stat-lbl">Alive</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--loss)" id="s-elim">0</div><div class="stat-lbl">Eliminated</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--live)" id="s-live">0</div><div class="stat-lbl">Live</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--text)" id="s-invested">$0</div><div class="stat-lbl">Invested</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--win)" id="s-earned">$0</div><div class="stat-lbl">Earned</div></div>
    <div class="stat"><div class="stat-val" id="s-pl">$0</div><div class="stat-lbl">P / L</div></div>
  </div>
</header>

<div class="payout-section">
  <div style="display:flex;align-items:center;gap:0.8rem;margin-bottom:0.6rem">
    <span class="payout-title" style="margin:0">PAYOUT STRUCTURE</span>
    <span style="flex:1;height:1px;background:var(--border)"></span>
    <span style="font-size:0.72rem;color:var(--accent);font-weight:600">POT: $8,740</span>
  </div>
  <div class="payout-grid" id="payout-grid"></div>
</div>

<div class="container" id="games" style="margin-top:0.5rem"></div>

<div class="summary-section">
  <div style="display:flex;align-items:center;gap:0.8rem;margin-bottom:0.6rem">
    <span class="payout-title" style="margin:0">PORTFOLIO SUMMARY</span>
    <span style="flex:1;height:1px;background:var(--border)"></span>
  </div>
  <table class="summary-table">
    <thead><tr><th>Team</th><th>Seed</th><th>Status</th><th class="right">Cost</th><th class="right">Earned</th><th class="right">P / L</th><th class="right">ROI</th></tr></thead>
    <tbody id="summary-body"></tbody>
    <tfoot id="summary-foot"></tfoot>
  </table>
</div>

<div class="footer" id="footer">Loading live scores...</div>

<script>
const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard";
const CORS_PROXIES = [
  "",
  "https://corsproxy.io/?",
  "https://api.allorigins.win/raw?url=",
];

const POT = 8740;
const PAYOUTS = [
  { name:"Round 1", pct:0.006 },
  { name:"Round 2", pct:0.011 },
  { name:"Sweet 16", pct:0.023 },
  { name:"Elite 8", pct:0.045 },
  { name:"Final 4", pct:0.063 },
  { name:"Champ", pct:0.125 },
  { name:"Blowout", pct:0.03 },
];

const TEAMS = [
  { name:"Nebraska", espnSearch:["nebraska"], seed:8, opponent:"Troy", oppSeed:9, day:"THU MAR 19", time:"11:40 AM CT", network:"TBS", region:"East", cost:93, roundsWon:0 },
  { name:"South Florida", espnSearch:["south florida","usf"], seed:11, opponent:"Louisville", oppSeed:6, day:"THU MAR 19", time:"12:30 PM CT", network:"truTV", region:"East", cost:33, roundsWon:0 },
  { name:"BYU", espnSearch:["byu","brigham young"], seed:6, opponent:"Texas", oppSeed:11, day:"THU MAR 19", time:"6:25 PM CT", network:"TNT", region:"West", cost:81, roundsWon:0 },
  { name:"Santa Clara", espnSearch:["santa clara"], seed:14, opponent:"Kentucky", oppSeed:3, day:"FRI MAR 20", time:"11:15 AM CT", network:"CBS", region:"South", cost:45, roundsWon:0 },
  { name:"Tennessee", espnSearch:["tennessee vol"], seed:5, opponent:"Miami (OH)", oppSeed:11, day:"FRI MAR 20", time:"3:25 PM CT", network:"TNT", region:"South", cost:100, roundsWon:0 },
  { name:"Iowa", espnSearch:["iowa hawkeyes"], seed:7, opponent:"Clemson", oppSeed:10, day:"FRI MAR 20", time:"5:50 PM CT", network:"CBS", region:"Midwest", cost:43, roundsWon:0 },
  { name:"Northern Iowa", espnSearch:["northern iowa"], seed:12, opponent:"St. John's", oppSeed:5, day:"FRI MAR 20", time:"6:10 PM CT", network:"TBS", region:"East", cost:42, roundsWon:0 },
  { name:"UCF", espnSearch:["ucf","central florida"], seed:10, opponent:"UCLA", oppSeed:7, day:"FRI MAR 20", time:"6:25 PM CT", network:"TNT", region:"East", cost:42, roundsWon:0 },
  { name:"Florida", espnSearch:["florida gators"], seed:1, opponent:"Prairie View A&M", oppSeed:16, day:"FRI MAR 20", time:"8:25 PM CT", network:"TBS", region:"South", cost:518, roundsWon:0 },
  { name:"UConn", espnSearch:["uconn","connecticut huskies"], seed:2, opponent:"Furman", oppSeed:15, day:"FRI MAR 20", time:"9:00 PM CT", network:"TBS", region:"East", cost:325, roundsWon:0 },
  { name:"Missouri", espnSearch:["missouri tiger","mizzou"], seed:10, opponent:"Miami (FL)", oppSeed:7, day:"FRI MAR 20", time:"9:10 PM CT", network:"truTV", region:"West", cost:37, roundsWon:0 },
];

let teamState = TEAMS.map(t => ({...t, status:"scheduled", myScore:null, oppScore:null, period:"", clock:"", displayClock:"", earnings:0}));
let workingProxy = null;

function calcEarnings(roundsWon) {
  let total = 0;
  for (let i = 0; i < roundsWon && i < 6; i++) total += POT * PAYOUTS[i].pct;
  return Math.round(total * 100) / 100;
}

function matchESPN(comp, cfg) {
  const name = (comp.team?.displayName || "").toLowerCase();
  const abbr = (comp.team?.abbreviation || "").toLowerCase();
  const short = (comp.team?.shortDisplayName || "").toLowerCase();
  const loc = (comp.team?.location || "").toLowerCase();
  return cfg.espnSearch.some(s => { const sl=s.toLowerCase(); return name.includes(sl)||abbr.includes(sl)||short.includes(sl)||loc.includes(sl); });
}

function resolveESPN(event, ci) {
  const comps = event.competitions[0].competitors;
  const my = comps[ci], opp = comps[ci===0?1:0];
  const ms = parseInt(my.score||"0"), os = parseInt(opp.score||"0");
  const state = event.status?.type?.state;
  const detail = event.status?.type?.shortDetail || "";
  if (state==="post") return { status:my.winner?"win":"loss", myScore:ms, oppScore:os, period:"FINAL", clock:"", displayClock:detail||"FINAL" };
  if (state==="in") return { status:"live", myScore:ms, oppScore:os, period:detail, clock:event.status?.displayClock||"", displayClock:detail };
  return { status:"scheduled", myScore:null, oppScore:null, period:"", clock:"", displayClock:"" };
}

async function fetchWithProxy(url) {
  if (workingProxy !== null) {
    try {
      const pu = workingProxy==="" ? url : workingProxy+encodeURIComponent(url);
      const r = await fetch(pu); if(r.ok) return await r.json();
    } catch(e) { workingProxy=null; }
  }
  for (const proxy of CORS_PROXIES) {
    try {
      const pu = proxy==="" ? url : proxy+encodeURIComponent(url);
      const r = await fetch(pu); if(r.ok) { workingProxy=proxy; return await r.json(); }
    } catch(e) { continue; }
  }
  return null;
}

async function fetchScores() {
  try {
    const allEvents = [];
    for (const d of ["20260319","20260320"]) {
      const data = await fetchWithProxy(ESPN_BASE+"?dates="+d+"&groups=100&limit=100");
      if (data?.events) allEvents.push(...data.events);
    }
    if (!allEvents.length) { updateFooter(true); return; }

    teamState = teamState.map(team => {
      for (const event of allEvents) {
        const comps = event.competitions?.[0]?.competitors||[];
        for (let ci=0; ci<comps.length; ci++) {
          if (matchESPN(comps[ci], team)) {
            const res = resolveESPN(event, ci);
            const oi = ci===0?1:0;
            const oc = comps[oi];
            const oppName = oc.team?.shortDisplayName||oc.team?.displayName||team.opponent;
            const oppSeed = parseInt(oc.curatedRank?.current)||parseInt(oc.seed||"0")||team.oppSeed;
            const mySeed = parseInt(comps[ci].curatedRank?.current)||parseInt(comps[ci].seed||"0")||team.seed;
            let network = team.network;
            const bc = event.competitions?.[0]?.broadcasts;
            if (bc?.length&&bc[0].names?.length) network=bc[0].names[0];
            let time = team.time;
            if (event.date) { const dt=new Date(event.date); time=dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"America/Chicago"})+" CT"; }
            let roundsWon = team.roundsWon;
            if (res.status==="win"&&roundsWon===0) roundsWon=1;
            return { ...team, ...res, opponent:oppName, oppSeed, seed:mySeed, network, time, roundsWon, earnings:calcEarnings(roundsWon) };
          }
        }
      }
      return team;
    });
    render();
    updateFooter(false);
  } catch(e) { console.error(e); updateFooter(true); }
}

function updateFooter(err) {
  const el = document.getElementById("footer");
  if (err) el.innerHTML='<span class="err">Unable to reach ESPN API. Retrying every 30s...</span>';
  else {
    const t=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
    const note = workingProxy ? " via proxy" : " direct";
    el.innerHTML='Auto-refreshes every 30s &middot; Last updated <span class="hl">'+t+'</span><span style="color:var(--dim)">'+note+'</span>';
  }
}

function renderPayouts() {
  document.getElementById("payout-grid").innerHTML = PAYOUTS.map((p,i) => {
    const amt=Math.round(POT*p.pct);
    return '<div class="payout-card'+(i===0?' active':'')+'"><div class="round-name">'+p.name+'</div><div class="round-pct">'+(p.pct*100).toFixed(1)+'%</div><div class="round-amt">$'+amt.toLocaleString()+'</div></div>';
  }).join("");
}

function render() {
  const alive=teamState.filter(t=>t.status!=="loss").length;
  const elim=teamState.filter(t=>t.status==="loss").length;
  const live=teamState.filter(t=>t.status==="live").length;
  const totalCost=teamState.reduce((s,t)=>s+t.cost,0);
  const totalEarned=teamState.reduce((s,t)=>s+t.earnings,0);
  const pl=totalEarned-totalCost;

  document.getElementById("s-alive").textContent=alive;
  document.getElementById("s-elim").textContent=elim;
  document.getElementById("s-live").textContent=live;
  document.getElementById("s-invested").textContent="$"+totalCost.toLocaleString();
  document.getElementById("s-earned").textContent="$"+Math.round(totalEarned).toLocaleString();
  const plEl=document.getElementById("s-pl");
  plEl.textContent=(pl>=0?"+$":"-$")+Math.abs(Math.round(pl)).toLocaleString();
  plEl.style.color=pl>0?"var(--win)":pl<0?"var(--loss)":"var(--muted)";

  const groups={};
  teamState.forEach(t=>{ if(!groups[t.day])groups[t.day]=[]; groups[t.day].push(t); });
  const ord={live:0,scheduled:1,win:2,loss:3};
  Object.values(groups).forEach(a=>a.sort((x,y)=>(ord[x.status]??9)-(ord[y.status]??9)));

  const c=document.getElementById("games"); c.innerHTML="";
  const td=new Date().getDate();

  for (const [day,games] of Object.entries(groups)) {
    const isToday=(td===19&&day.includes("19"))||(td===20&&day.includes("20"));
    let h='<div class="day-hdr"><span class="day-lbl '+(isToday?'today':'')+'">'+(isToday?"TODAY":day)+'</span><span class="day-line"></span></div>';
    games.forEach(g => {
      let st="";
      if(g.status==="win") st='<div class="score" style="color:var(--win)">'+g.myScore+' - '+g.oppScore+'</div><span class="badge badge-win">WIN</span>';
      else if(g.status==="loss") st='<div class="score" style="color:var(--loss)">'+g.myScore+' - '+g.oppScore+'</div><span class="badge badge-loss">LOSS</span>';
      else if(g.status==="live") st='<div class="score" style="color:var(--live)">'+g.myScore+' - '+g.oppScore+'</div><div style="display:flex;align-items:center;gap:0.4rem;justify-content:flex-end"><span class="badge badge-live">&bull; LIVE</span>'+(g.displayClock?'<span style="font-size:0.6rem;color:var(--muted)">'+g.displayClock+'</span>':'')+'</div>';
      else st='<div class="time-disp">'+g.time+'</div><span class="badge badge-sched">'+g.network+'</span>';

      let ec="earnings-zero", et="$0";
      if(g.earnings>0){ec="earnings-pos";et="+$"+Math.round(g.earnings);}
      else if(g.status==="loss"){ec="earnings-neg";et="-$"+g.cost;}

      h+='<div class="card card-border-'+g.status+'"><div><div class="matchup"><span class="seed">('+g.seed+')</span><span class="my-team">'+g.name+'</span><span class="vs">vs</span><span class="seed">('+g.oppSeed+')</span><span class="opp">'+g.opponent+'</span></div><div class="meta-row"><span>'+g.region+' Region</span><span class="cost-tag">Paid $'+g.cost+'</span><span class="earnings-tag '+ec+'">'+et+'</span></div></div><div class="status-col">'+st+'</div></div>';
    });
    c.innerHTML+=h;
  }

  const sorted=[...teamState].sort((a,b)=>a.seed-b.seed || b.cost-a.cost);
  document.getElementById("summary-body").innerHTML=sorted.map(t=>{
    const pl=t.earnings-t.cost; const roi=t.cost>0?((pl/t.cost)*100):0;
    const pc=pl>0?"pos":(t.status==="loss"?"neg":"neutral");
    const sl=t.status==="win"?"W"+t.roundsWon:t.status==="loss"?"OUT":t.status==="live"?"LIVE":"--";
    return '<tr><td class="team-name">'+t.name+'</td><td>'+t.seed+'</td><td>'+sl+'</td><td class="right">$'+t.cost+'</td><td class="right">$'+Math.round(t.earnings)+'</td><td class="right '+pc+'">'+(pl>=0?"+":"-")+"$"+Math.abs(Math.round(pl))+'</td><td class="right '+pc+'">'+(roi>=0?"+":"")+roi.toFixed(0)+'%</td></tr>';
  }).join("");

  const te=totalEarned, tc=totalCost, tp=te-tc, tr=tc>0?((tp/tc)*100):0;
  const tpc=tp>0?"pos":tp<0?"neg":"neutral";
  document.getElementById("summary-foot").innerHTML='<tr><td colspan="3">TOTAL</td><td class="right">$'+tc+'</td><td class="right">$'+Math.round(te)+'</td><td class="right '+tpc+'">'+(tp>=0?"+":"-")+"$"+Math.abs(Math.round(tp))+'</td><td class="right '+tpc+'">'+(tr>=0?"+":"")+tr.toFixed(0)+'%</td></tr>';
}

renderPayouts();
render();
fetchScores();
setInterval(fetchScores, 15000);
</script>
</body>
</html>
